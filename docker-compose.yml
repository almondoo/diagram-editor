services:
  app:
    build: .
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    ports:
      - "5173:5173"
    command: sh -c "pnpm install && pnpm -r build && pnpm --filter diagram-editor-web dev --host"
    tty: true
    stdin_open: true
volumes:
  node_modules:
